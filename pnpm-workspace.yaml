allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  core-js: false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
  workerd: true
ignoredBuiltDependencies:
  - vue-demi

# pkg.pr.new builds depend on each other through tarball URLs
blockExoticSubdeps: false

# Nitro v3's dev bundle (.nuxt/dev) imports these module server deps by bare name
publicHoistPattern:
  - '@intlify/h3'
  - chokidar
  # lets Vite resolve @nuxtjs/mdc's `@nuxtjs/mdc > unified`-style optimizeDeps.include entries
  - '@nuxtjs/mdc'

minimumReleaseAgeExclude:
  - '@storybook/addon-a11y@0.0.0-pr-35247-sha-45858977 || 0.0.0-pr-35247-sha-b1e0dc56'
  - '@storybook/addon-docs@0.0.0-pr-35247-sha-45858977 || 0.0.0-pr-35247-sha-b1e0dc56'
  - '@storybook/builder-vite@0.0.0-pr-35247-sha-45858977'
  - '@storybook/csf-plugin@0.0.0-pr-35247-sha-45858977'
  - '@storybook/react-dom-shim@0.0.0-pr-35247-sha-45858977 || 0.0.0-pr-35247-sha-b1e0dc56'
  - '@storybook/vue3@0.0.0-pr-35247-sha-45858977'
  - '@storybook/vue3-vite@0.0.0-pr-35247-sha-45858977'
  - eslint-plugin-storybook@0.0.0-pr-35247-sha-45858977 || 0.0.0-pr-35247-sha-b1e0dc56
  - storybook@0.0.0-pr-35247-sha-45858977 || 0.0.0-pr-35247-sha-b1e0dc56
  - vue-onigiri@0.6.3
  - '@nuxt/kit-nightly@5.0.0-29841792.9ceeba8c'
  - '@nuxt/nitro-server-nightly@5.0.0-29841792.9ceeba8c'
  - '@nuxt/schema-nightly@5.0.0-29841792.9ceeba8c'
  - '@nuxt/vite-builder-nightly@5.0.0-29841792.9ceeba8c'
  - '@nuxt/vite-server-nightly@5.0.0-29841792.9ceeba8c'
  - nuxt-nightly@5.0.0-29841792.9ceeba8c

# Force the Storybook graph onto the same PR-preview build so internal APIs line up.
overrides:
  # nuxt/nuxt#36217 (vue-onigiri) preview build, pinned to the commit nuxt's own deps point at so each package resolves once
  nuxt: https://pkg.pr.new/nuxt/nuxt@ae7393c82c1d24d1e06dc1d0bfb2e8defe2cb4a4
  '@nuxt/kit': https://pkg.pr.new/nuxt/nuxt/@nuxt/kit@ae7393c82c1d24d1e06dc1d0bfb2e8defe2cb4a4
  '@nuxt/schema': https://pkg.pr.new/nuxt/nuxt/@nuxt/schema@ae7393c82c1d24d1e06dc1d0bfb2e8defe2cb4a4
  '@nuxt/vite-builder': https://pkg.pr.new/nuxt/nuxt/@nuxt/vite-builder@ae7393c82c1d24d1e06dc1d0bfb2e8defe2cb4a4
  '@nuxt/nitro-server': https://pkg.pr.new/nuxt/nuxt/@nuxt/nitro-server@ae7393c82c1d24d1e06dc1d0bfb2e8defe2cb4a4
  '@nuxt/vite-server': https://pkg.pr.new/nuxt/nuxt/@nuxt/vite-server@ae7393c82c1d24d1e06dc1d0bfb2e8defe2cb4a4
  # 20260927 adds a dev nitro plugin that Nuxt 5's import protection rejects
  '@nuxt/cli': npm:@nuxt/cli-nightly@4.0.0-20260926-162335-6eaa0eb
  '@storybook/builder-vite': 0.0.0-pr-35247-sha-45858977
  '@storybook/csf-plugin': 0.0.0-pr-35247-sha-45858977
  '@storybook/vue3': 0.0.0-pr-35247-sha-45858977
  '@storybook/vue3-vite': 10.6.1

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - core-js
  - esbuild
  - sharp
